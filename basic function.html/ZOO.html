<!DOCTYPE html>
<html>
    <head>
        <title>My Zoo</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f0f0f0;
                text-align: center;
                padding: 30px;
            }
            h1 {
                color: #ff5a43;

            }
            #zoo{
                border: 2px solid #ff5a43;
                width: 300px;
                margin: 16px auto;
                padding: 12px;
                border-radius: 10px;
                background:white;

            }
            .zone{
                border: 1px solid #ff5a43;
                margin: 6px 0;
                padding: 8px 12px;
                border-radius: 6px;
                text-align: left;
            }
            button {
                background-color: #ff5a43;
                color: white;
                border: none;
                padding: 10px 20px;
                border-radius: 20px;
                cursor: pointer;
                border-radius: 5px;
            }
        </style>
    </head>
    <body>
        <h1>My Zoo</h1>
        <p>Use javascript and DOM to add animals to each cage

        </p>
        <div id="zoo">
            <div class="zone">Zone 1: <span id="zone1"></span></div>
        
         
         <div class="zone">Zone 2: <span id="zone2"></span></div>
            <div class="zone">Zone 3: <span id="zone3"></span></div>
            <div class="zone">Total Animals: <span id="total"></span></div>
        </div>
        <br>
        <button onclick="openZoo()">Open the Zoo!</button>
        <p id="zoo-status"></p>
        <script>
            function openZoo() {
                document.getElementById("zone1").innerHTML = "lion";
                document.getElementById("zone2").innerHTML = "elephant";
                document.getElementById("zone3").innerHTML = "penguin";
                document.getElementById("total").innerHTML = 3;
                document.getElementById("zoo-status").style.color = "lightgreen";
                document.getElementById("zoo-status").innerHTML = document.title+" is now open!";
            }
        </script>
    </body>
</html>
