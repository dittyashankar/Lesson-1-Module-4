<!DOCTYPE html>
<html>
    <head>
        <title>Basic Functions</title>
    </head>
    <body>
        <h1>Basic Functions</h1>
        <p>This is a simple HTML page to demonstrate basic functions.</p>
        <button onclick="myfunction(5)">Execute JS Function</button>
        <script>
            function myfunction(x,y)
            {
                if (y=== undefined){
                y=2;
            }
            document.write(x*y);
        }
        </script>
    </body>
</html>
