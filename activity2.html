<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript Variables</title>
</head>
<body>
    <h1>Javascript Variables</h1>
    <p id="myp"> </p>
    <script>
        var a=5;
        var b=6;
        var sum=a+b;
        document.getElementById("myp").innerHTML="the sum of two variables: "+sum;
    </script>
</body>
</html>
