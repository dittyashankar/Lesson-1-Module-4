<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oprators in javascript</title>
</head>
<body>
    <h1>Oprators In Javascript</h1>
    <p id="multiplication"></p>
    <p id="division"></p>
    <script>
        var x,y,z,e;
        x=3;
        y=6;
        z= x*y;
        e= x/y;
        document.getElementById("multiplication").innerHTML="Multiplication:"+z;
        document.getElementById("division").innerHTML="division:"+e;
    </script>
</body>
</html>
